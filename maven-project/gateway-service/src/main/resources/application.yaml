spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: resource-service
              uri: lb://resource-service
              predicates:
                - Path=/resources/**
            - id: song-service
              uri: lb://song-service
              predicates:
                - Path=/songs/**

server:
  port: ${GATEWAY_SERVER_PORT:8085}

eureka:
  instance:
    healthCheckUrlPath: "/actuator/health"
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    ssl:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE