<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Storages</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Storages</h1>
        <div class="d-flex align-items-center gap-3">

        <span th:if="${user != null}">
            Logged in as
            <strong th:text="${user.getName()}">
                User
            </strong>
        </span>

            <form th:action="@{/logout}" method="post">
                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <button
                        type="submit"
                        class="btn btn-outline-secondary">
                    Logout
                </button>
            </form>

        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Add Storage</h5>
        </div>

        <div class="card-body">

            <form
                    th:action="@{/storage-client/create}"
                    method="post">

                <!-- CSRF token for Spring Security -->
                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <div class="row g-3">

                    <!-- Storage Type -->
                    <div class="col-md-4">
                        <label for="storageType" class="form-label">
                            Storage Type
                        </label>

                        <select
                                id="storageType"
                                name="storageType"
                                class="form-select"
                                required>

                            <option value="" selected disabled>
                                Select storage type
                            </option>

                            <option value="STAGING">
                                STAGING
                            </option>

                            <option value="PERMANENT">
                                PERMANENT
                            </option>

                            <option value="DEFAULT">
                                DEFAULT
                            </option>

                        </select>
                    </div>

                    <!-- Container Name -->
                    <div class="col-md-4">
                        <label for="containerName" class="form-label">
                            Container Name
                        </label>

                        <input
                                type="text"
                                id="containerName"
                                name="containerName"
                                class="form-control"
                                placeholder="Container name"
                                required>
                    </div>

                    <!-- Path -->
                    <div class="col-md-4">
                        <label for="path" class="form-label">
                            Path
                        </label>

                        <input
                                type="text"
                                id="path"
                                name="path"
                                class="form-control"
                                placeholder="Path"
                                required>
                    </div>

                </div>

                <div class="mt-3">
                    <button
                            type="submit"
                            class="btn btn-primary">
                        Add Storage
                    </button>
                </div>

            </form>

        </div>
    </div>

    <div class="card">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(storages)}"
                 class="alert alert-info mb-0">
                No storage entries found.
            </div>

            <div th:unless="${#lists.isEmpty(storages)}"
                 class="table-responsive">

                <table class="table table-striped table-hover align-middle mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th>Storage ID</th>
                        <th>Storage Type</th>
                        <th>Container Name</th>
                        <th>Path</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="storage : ${storages}">

                        <td th:text="${storage.Id}">
                            1111
                        </td>

                        <td>
                            <span
                                    class="badge bg-secondary"
                                    th:text="${storage.storageType}">
                                STAGING
                            </span>
                        </td>

                        <td th:text="${storage.containerName}">
                            staging-fallback-resource-1
                        </td>

                        <td th:text="${storage.path}">
                            files
                        </td>

                        <td class="text-end">

                            <form
                                    th:action="@{/storage-client(id=${storage.Id})}"
                                    method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('Are you sure you want to delete this storage?');">

                                <input type="hidden" name="_method" value="delete">

                                <!-- Required when Spring Security CSRF is enabled -->
<!--                                <input-->
<!--                                        type="hidden"-->
<!--                                        th:name="${_csrf.parameterName}"-->
<!--                                        th:value="${_csrf.token}">-->

                                <button
                                        type="submit"
                                        class="btn btn-sm btn-danger">
                                    Delete
                                </button>
                            </form>

                        </td>

                    </tr>
                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
