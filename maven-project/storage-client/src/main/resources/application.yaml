server:
  port: ${STORAGE_CLIENT_PORT:8095}
  servlet:
    session:
      cookie:
        name: STORAGE_CLIENT_SESSION

spring:
  application:
    name: storage-client
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          storage-client:
            provider: auth-server
            client-id: storage-client
            client-secret: storage-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8095/login/oauth2/code/storage-client"
            scope: openid, readStorageEntries, createStorageEntries, deleteStorageEntries
        provider:
          auth-server:
            issuer-uri: ${ISSUER_URI:http://localhost:9000}

resilience4j.circuitbreaker:
  instances:
    StorageServiceClientgetAllStorageEntries:
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 5
      minimumNumberOfCalls: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
      registerHealthIndicator: true

eureka:
  instance:
    healthCheckUrlPath: "/actuator/health"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_SERVICE_URL:http://localhost:8762/eureka/}
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"

