server.port=${RESOURCE_SERVICE_SERVER_PORT:8082}
spring.application.name=resource-service
spring.datasource.url=${RESOURCE_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${RESOURCE_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${RESOURCE_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_SERVICE_URL:http://localhost:8761/eureka/}