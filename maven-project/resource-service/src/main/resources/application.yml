server:
  port: ${RESOURCE_SERVICE_SERVER_PORT:8084}

spring:
  application:
    name: resource-service
  datasource:
    url: ${RESOURCE_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
    username: ${RESOURCE_SERVICE_DATASOURCE_USERNAME:postgres}
    password: ${RESOURCE_SERVICE_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    azure:
      credential:
        client-id: ${AZURE_CLIENT_ID}
        client-secret: ${AZURE_CLIENT_SECRET}
      profile:
        tenant-id: ${AZURE_TENANT_ID}
      storage:
        blob:
          account-name: microservstorageaccksh
          container-name: resource
          endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:https://microservstorageaccksh.blob.core.windows.net/}
  security:
    oauth2:
      client:
        registration:
          storage-service:
            provider: auth-server
            client-id: resource-service
            client-secret: resource-service-secret
            authorization-grant-type: client_credentials
            scope: readStorageEntries
        provider:
          auth-server:
            token-uri: ${TOKEN_URI:http://localhost:9000/oauth2/token}
#            issuer-uri: ${AUTH_SERVER_PROVIDER_URL:http://localhost:9000/oauth2/token}

eureka:
  instance:
    healthCheckUrlPath: "/actuator/health"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_SERVICE_URL:http://localhost:8762/eureka/}
    healthcheck:
      enabled: true

resilience4j.circuitbreaker:
  instances:
    storage-service:
      registerHealthIndicator: true
      ringBufferSizeInClosedState: 5
      ringBufferSizeInHalfOpenState: 3
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      recordExceptions:
        - feign.RetryableException
        - feign.FeignException
      ignoreExceptions:

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    ssl:
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"
