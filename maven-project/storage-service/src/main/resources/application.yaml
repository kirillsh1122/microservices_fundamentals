server:
  port: ${STORAGE_SERVICE_SERVER_PORT:8088}

spring:
  application:
    name: storage-service
  datasource:
    url: ${STORAGE_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5434/storage-db}
    username: ${STORAGE_SERVICE_DATASOURCE_USERNAME:postgres}
    password: ${STORAGE_SERVICE_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}

eureka:
  instance:
    healthCheckUrlPath: "/actuator/health"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_SERVER_SERVICE_URL:http://localhost:8762/eureka/}"
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    ssl:
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"
