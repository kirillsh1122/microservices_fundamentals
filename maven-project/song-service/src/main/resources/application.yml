spring:
  application:
    name: "song-service"
  datasource:
    url: "${SONG_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song-db}"
    username: "${SONG_SERVICE_DATASOURCE_USERNAME:postgres}"
    password: "${SONG_SERVICE_DATASOURCE_PASSWORD:postgres}"
  jpa:
    hibernate:
      ddl-auto: "${DDL_AUTO:update}"

server:
  port: "${SONG_SERVICE_SERVER_PORT:8083}"

eureka:
  instance:
    healthCheckUrlPath: "/actuator/health"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_SERVER_SERVICE_URL:http://localhost:8761/eureka/}"
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    ssl:
      enabled: false
