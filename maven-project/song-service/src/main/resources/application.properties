spring.application.name=song-service
spring.datasource.url=${SONG_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song-db}
spring.datasource.username=${SONG_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SONG_SERVICE_DATASOURCE_PASSWORD:postgres}
server.port=${SONG_SERVICE_SERVER_PORT:8083}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_SERVICE_URL:http://localhost:8761/eureka/}